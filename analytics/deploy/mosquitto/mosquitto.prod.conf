# Production: stub. TODO (ADR-0004):
# - WebSocket listener 9002 for karts and timing devices. Only the border Nginx reaches it,
#   and Nginx only forwards clients with a certificate from our device CA.
# - Users and roles in the dynamic security plugin instead of the password file: one user per
#   device (kart id, speedcamera-<device_id>), pinned to its client id. Each kart may only use
#   its own kart/<id>/ topics, only command-api may publish kart/+/cmd and kart/+/profile, and
#   only timing devices kart/+/laps (they read kart/+/live and kart/+/status).
set_tcp_nodelay true

# ingest, command-api (compose network). TODO (ADR-0004): no longer published once devices use 9002.
listener 1883

# Pit wall live view (MQTT over WebSocket). TODO: TLS (wss) via reverse proxy,
# read-only ACL for browser clients (subscribe kart/+/live, kart/+/status and kart/+/laps only).
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
