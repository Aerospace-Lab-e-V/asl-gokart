# Production: stub. TODO: mTLS listener for karts (require_certificate true),
# password/ACL file so only command-api may publish to kart/+/cmd and only the
# lap timing device (user speedcamera) to kart/+/laps; it reads kart/+/live and kart/+/status.
set_tcp_nodelay true

listener 1883

# Pit wall live view (MQTT over WebSocket). TODO: TLS (wss) via reverse proxy,
# read-only ACL for browser clients (subscribe kart/+/live, kart/+/status and kart/+/laps only).
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
