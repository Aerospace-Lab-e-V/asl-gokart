# Production broker (ADR-0004). Users, roles and ACLs live in the dynamic security plugin
# (/mosquitto/data/dynamic-security.json, created by start.sh on the first start). The
# enroll service keeps the internal users and creates one user per enrolled device.
set_tcp_nodelay true
per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ingest, enroll (and later command-api) on the compose network. Not published.
listener 1883

# Pit wall live view (MQTT over WebSocket) through Caddy; the read-only pit-wall user.
listener 9001
protocol websockets

# Karts and timing devices. Only the border Nginx may reach this port (Proxmox firewall),
# and Nginx forwards only clients with a certificate from our device CA.
listener 9002
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
