# Requested from the lab admins: one server block on the border Nginx, for devices and the
# pit wall (ADR-0004) and Grafana under /grafana/ (deploy/vm/README.md, section 7.3).
# Placeholders: <DEVICE_HOST> (a name under the lab's wildcard certificate), <VM_IP>,
# <LAB_NET>, <VPN_NET>. The device CA certificate comes from `sudo kart-enroll ca` on
# the VM; it is public.
#
# In the http {} context (once):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   limit_req_zone $binary_remote_addr zone=kart_enroll:1m rate=30r/m;

server {
    listen 443 ssl;
    server_name <DEVICE_HOST>;
    # ssl_certificate / ssl_certificate_key: the wildcard certificate, as for the other sites.

    ssl_client_certificate /etc/nginx/kart-device-ca.pem;
    # optional, not on: /enroll/ must work without a certificate. /mqtt checks it below.
    ssl_verify_client optional;
    ssl_verify_depth 1;

    # Browsers only (devices ignore it); the host is HTTPS-only anyway.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Karts and timing devices: MQTT over WebSocket, only with a device certificate.
    location /mqtt {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://<VM_IP>:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Devices ping every 5 s; this only has to outlast a ping.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Enrollment requests. Phase 1: lab network and VPN only. Phase 2 (management
    # interface behind Keycloak): drop the allow/deny lines.
    location /enroll/ {
        allow <LAB_NET>;
        allow <VPN_NET>;
        deny all;
        limit_req zone=kart_enroll burst=10 nodelay;
        client_max_body_size 16k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://<VM_IP>:8082;
    }

    # Pit wall (SPA and /api/ through its Caddy). Phase 1: lab network and VPN only, until
    # Keycloak is in front; other clients get 403.
    location / {
        allow <LAB_NET>;
        allow <VPN_NET>;
        deny all;
        proxy_pass http://<VM_IP>:8080;
    }

    # The pit wall's live view: MQTT over WebSocket with its read-only user. Its own path,
    # since /mqtt above is the device listener. Needs "mqttUrl":
    # "wss://<DEVICE_HOST>/pit-wall/mqtt" in the VM's pit-wall.config.json.
    location = /pit-wall/mqtt {
        allow <LAB_NET>;
        allow <VPN_NET>;
        deny all;
        proxy_pass http://<VM_IP>:8080/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The pit wall pings every 10 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Grafana: open to the internet, every user signs in with the lab SSO (Keycloak). Grafana
    # serves from /grafana/ itself (GF_SERVER_SERVE_FROM_SUB_PATH), so the path passes through
    # unchanged.
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://<VM_IP>:3000;
    }

    # Password login (only the break-glass admin has one): lab network and VPN only. The page
    # itself (GET) stays open, it carries the "Sign in with Lab SSO" button.
    location = /grafana/login {
        limit_except GET {
            allow <LAB_NET>;
            allow <VPN_NET>;
            deny all;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://<VM_IP>:3000;
    }

    # Grafana Live: dashboard updates over WebSocket.
    location /grafana/api/live/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://<VM_IP>:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
