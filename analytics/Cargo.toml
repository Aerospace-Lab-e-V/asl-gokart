[workspace]
resolver = "3"
members = [
    "crates/telemetry-schema",
    "crates/ecu-sero",
    "crates/sero-sys",
    "crates/kart-mqtt",
    "crates/kart-agent",
    "crates/ingest",
    "crates/kart-sim",
    "crates/pit-api",
    "crates/enroll-proto",
    "crates/enroll",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
telemetry-schema = { path = "crates/telemetry-schema" }
ecu-sero = { path = "crates/ecu-sero" }
sero-sys = { path = "crates/sero-sys" }
kart-mqtt = { path = "crates/kart-mqtt" }
enroll-proto = { path = "crates/enroll-proto" }

anyhow = "1"
axum = "0.8"
cc = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# Stream combinators for the SSE stream (already in the tree through axum).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
# zstd only: lz4 would add a second C library to cross-compile.
mcap = { version = "0.25", default-features = false, features = ["zstd"] }
# Only the sentences the GPS provider reads (kart-agent/src/gps).
nmea = { version = "0.8", default-features = false, features = ["std", "GGA", "GSA", "RMC", "TXT"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
# Device certificates (ADR-0004): keys and CSRs on the devices, signing in enroll. ring
# rather than aws-lc: no C build to cross-compile with cargo zigbuild.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Enrollment requests from kart-agent; ring + bundled public roots (webpki-roots).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Devices use wss:// with a client certificate (ADR-0004); the internal services plain mqtt://.
# The crypto provider is installed by kart-mqtt (ring), not chosen by rumqttc.
rumqttc = { version = "0.25", default-features = false, features = [
    "url",
    "websocket",
    "use-rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
# No libudev: nothing to cross-compile, and the GPS is found via /dev/serial/by-id.
serialport = { version = "4", default-features = false }
serde_json = "1"
serde_norway = "0.9"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
webpki-roots = "1"

# Shipped binaries (kart-agent in the headunit package).
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
