[workspace]
resolver = "3"
members = [
    "crates/telemetry-schema",
    "crates/ecu-sero",
    "crates/sero-sys",
    "crates/kart-mqtt",
    "crates/kart-agent",
    "crates/ingest",
    "crates/kart-sim",
    "crates/pit-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
telemetry-schema = { path = "crates/telemetry-schema" }
ecu-sero = { path = "crates/ecu-sero" }
sero-sys = { path = "crates/sero-sys" }
kart-mqtt = { path = "crates/kart-mqtt" }

anyhow = "1"
axum = "0.8"
cc = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# Stream combinators for the SSE stream (already in the tree through axum).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
# zstd only: lz4 would add a second C library to cross-compile.
mcap = { version = "0.25", default-features = false, features = ["zstd"] }
# Only the sentences the GPS provider reads (kart-agent/src/gps).
nmea = { version = "0.8", default-features = false, features = ["std", "GGA", "GSA", "RMC", "TXT"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
# No TLS yet: plain MQTT inside the WireGuard tunnel / dev network. mTLS comes with kart-agent.
sd-notify = "0.5"
rumqttc = { version = "0.25", default-features = false, features = ["url"] }
serde = { version = "1", features = ["derive"] }
# No libudev: nothing to cross-compile, and the GPS is found via /dev/serial/by-id.
serialport = { version = "4", default-features = false }
serde_json = "1"
serde_norway = "0.9"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

# Shipped binaries (kart-agent in the headunit package).
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
