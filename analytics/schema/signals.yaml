  # --- Drivetrain ----------------------------------------------------------
  - id: 201
    name: drive.throttle
    ecu: motor
    unit: "%"
    rate_hz: 10
    min: 0
    max: 100
    description: Throttle pedal position, max of the two Kelly throttle readings scaled 0–255 → 0–100 % (approximate)
  - id: 202
    name: drive.rpm_left
    ecu: motor
    unit: rpm
    rate_hz: 10
    min: 0
    max: 6000
