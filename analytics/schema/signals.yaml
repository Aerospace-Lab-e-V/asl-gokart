# Signal catalog: the source of truth for every telemetry signal.
#
# Rules:
#   - `id` is what goes over the wire (Sample.signal_id) and into the DB. Never reuse
#     or renumber an id; retire a signal by marking it `deprecated: true`.
#   - Ids are grouped by subject: 1xx battery, 2xx drivetrain, 3xx gps, 4xx temperatures,
#     5xx lights. `ecu` names the zone controller that measures the signal.
#   - `rate_hz` is the nominal (maximum) sample rate; `min`/`max` are the plausible physical range.
#     Signals described as "sent on change" only arrive when their value changes.
#   - Enums and booleans are sent as numbers; their meaning is given in `description`.
#   - `_raw` signals carry the ECU's unscaled value. They stay raw forever; a scaled
#     version gets a new id once its scaling is verified.
#   - Sero wire layouts and derived signals live in crates/ecu-sero.

signals:
  # --- Battery -------------------------------------------------------------
  - id: 101
    name: battery.voltage
    ecu: battery
    unit: V
    rate_hz: 10
    min: 0
    max: 80
    description: Pack voltage from the BMS, polled at 10 Hz and sent on change
  - id: 102
    name: battery.current
    ecu: battery
    unit: A
    rate_hz: 10
    min: -100
    max: 300
    description: Pack current from the BMS, positive = discharge, negative = regen; polled at 10 Hz and sent on change
  - id: 103
    name: battery.temp
    ecu: battery
    unit: °C
    rate_hz: 0.5
    min: -20
    max: 80
    description: Hottest valid pack temperature sensor (max of battery.temp_N)
  - id: 104
    name: battery.soc
    ecu: battery
    unit: "%"
    rate_hz: 1
    min: 0
    max: 100
    description: State of charge (no ECU sends this yet)
  - id: 105
    name: battery.power
    ecu: battery
    unit: kW
    rate_hz: 10
    min: -5
    max: 15
    description: Pack power, positive = discharge; derived on the kart from voltage × current
  - id: 106
    name: battery.voltage_ctrl_left
    ecu: motor
    unit: V
    rate_hz: 10
    min: 0
    max: 255
    description: Battery voltage as measured by the left Kelly controller (whole volts, scaling unverified)
  - id: 107
    name: battery.voltage_ctrl_right
    ecu: motor
    unit: V
    rate_hz: 10
    min: 0
    max: 255
    description: Battery voltage as measured by the right Kelly controller (whole volts, scaling unverified)
