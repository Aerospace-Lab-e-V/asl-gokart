# CI — Analytics
# Checks the Rust workspace and the pit wall on PRs and main. Releases (analytics-v* tags)
# run the same checks in ci-analytics-release.yml before images are published.

name: CI — Analytics

on:
    pull_request:
        paths:
            - 'analytics/**'
            - '.github/workflows/_analytics.yml'
            - '.github/workflows/ci-analytics.yml'
    push:
        branches: [main]
        paths:
            - 'analytics/**'
            - '.github/workflows/_analytics.yml'
            - '.github/workflows/ci-analytics.yml'
    workflow_dispatch:

jobs:
    analytics:
        uses: ./.github/workflows/_analytics.yml
