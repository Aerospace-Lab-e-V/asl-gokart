# Reusable workflow — Analytics build & check
# Called by ci-analytics.yml (currently manual trigger only)

name: Analytics

on:
    workflow_call:

jobs:
    rust:
        name: Rust workspace
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: analytics
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: analytics

            - name: Format
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings

            - name: Test
              run: cargo test --workspace --locked

    pit-wall:
        name: Pit wall
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: analytics/web/pit-wall
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Protobuf types, signal catalog and route tree (also runs before build)
            - name: Generate code
              run: bun run gen

            - name: Lint
              run: bun run lint

            - name: Format
              run: bun run format:check

            - name: Typecheck
              run: bun run typecheck

            - name: Unit tests
              run: bun run test

            - name: Build
              run: bun run build
