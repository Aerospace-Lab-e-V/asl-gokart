# Reusable workflow — Headunit test & build
# Called by ci-headunit.yml and ci-release.yml

name: Headunit

on:
    workflow_call:
        inputs:
            is-tag:
                description: Whether this run was triggered by a version tag
                type: boolean
                required: true
            is-pr:
                description: Whether this run was triggered by a pull request
                type: boolean
                required: true

jobs:
    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infotainment/headunit
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6.2.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
                  registries: |
                      https://registry.npmjs.org/
                      @asl-gokart:https://registry.leotm.de/

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Run unit tests
              run: bun run test:unit

    # Pure headunit app changes skip the kart-agent build. Tags always build everything.
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        if: ${{ !inputs.is-tag }}
        permissions:
            contents: read
            pull-requests: read
        outputs:
            kart-agent: ${{ steps.filter.outputs.kart-agent }}
        steps:
            - uses: actions/checkout@v6

            # Everything the agent binary or its packaging depends on.
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      kart-agent:
                          - 'analytics/crates/kart-agent/**'
                          - 'analytics/crates/sero-sys/**'
                          - 'analytics/crates/ecu-sero/**'
                          - 'analytics/crates/kart-mqtt/**'
                          - 'analytics/crates/telemetry-schema/**'
                          - 'analytics/schema/**'
                          - 'analytics/Cargo.toml'
                          - 'analytics/Cargo.lock'
                          - 'infotainment/headunit/packaging/**'
                          - 'infotainment/headunit/forge.config.ts'
                          - '.github/workflows/_headunit.yml'

    # kart-agent ships inside the headunit package (analytics/docs/adr/0001-kart-agent-integration.md).
    # Pushes to main build it too, to save the Rust cache that PRs restore from.
    kart-agent:
        name: kart-agent (${{ matrix.arch }})
        runs-on: ubuntu-latest
        needs: [changes]
        if: ${{ !cancelled() && (inputs.is-tag || needs.changes.outputs.kart-agent == 'true') }}
        strategy:
            matrix:
                include:
                    - arch: x64
                      target: x86_64-unknown-linux-gnu
                    - arch: arm64
                      target: aarch64-unknown-linux-gnu
        defaults:
            run:
                working-directory: analytics
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true # sero headers for sero-sys

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: analytics
                  key: ${{ matrix.target }}
                  # PR and tag caches are only visible to their own ref, so only main saves.
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            # zig cross-links against an old glibc (2.31: Raspberry Pi OS bullseye and later)
            # and compiles sero-sys's C++ shim, with no target toolchain to install.
            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.13.0

            - name: Install cargo-zigbuild
              run: cargo install --locked cargo-zigbuild@0.23.4

            - name: Lint and test
              if: matrix.arch == 'x64'
              run: |
                  cargo clippy --locked --all-targets -p kart-agent -p sero-sys -p ecu-sero -p kart-mqtt -- -D warnings
                  cargo test --locked -p kart-agent -p sero-sys -p ecu-sero -p kart-mqtt -p telemetry-schema

            - name: Build
              run: |
                  version=$(jq -r .version ../infotainment/headunit/package.json)
                  KART_AGENT_VERSION="$version" cargo zigbuild --locked --profile dist -p kart-agent --target ${{ matrix.target }}.2.31

            - name: Check the binary
              run: |
                  bin=target/${{ matrix.target }}/dist/kart-agent
                  file "$bin"
                  if readelf -d "$bin" | grep -qE 'libstdc\+\+|libc\+\+'; then
                      echo "::error::kart-agent links a C++ standard library"; exit 1
                  fi
                  if readelf -V "$bin" | grep -qE 'GLIBC_2\.(3[2-9]|[4-9][0-9])'; then
                      echo "::error::kart-agent needs a glibc newer than 2.31"; exit 1
                  fi

            - name: Upload artifact
              if: inputs.is-pr || inputs.is-tag
              uses: actions/upload-artifact@v7
              with:
                  name: kart-agent-${{ matrix.arch }}
                  path: analytics/target/${{ matrix.target }}/dist/kart-agent
                  retention-days: 7

    build-x86:
        name: Build (x86_64)
        runs-on: ubuntu-latest
        needs: [test, kart-agent]
        # Runs without the agent when kart-agent was skipped (pure app change).
        if: >-
            ${{ !cancelled() && (inputs.is-pr || inputs.is-tag)
            && needs.test.result == 'success'
            && (needs.kart-agent.result == 'success' || (needs.kart-agent.result == 'skipped' && !inputs.is-tag)) }}
        env:
            WITH_AGENT: ${{ needs.kart-agent.result == 'success' }}
        defaults:
            run:
                working-directory: infotainment/headunit
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # branch lookup for the watermark

            # Shown in the pre-release watermark; tag builds run on a detached HEAD, so look up the branch.
            - name: Resolve build branch
              run: |
                  branch="${GITHUB_HEAD_REF:-$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' | awk '$0 != "HEAD" && !b { b = $0 } END { print b }')}"
                  echo "HEADUNIT_BUILD_BRANCH=${branch:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v6.2.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
                  registries: |
                      https://registry.npmjs.org/
                      @asl-gokart:https://registry.leotm.de/

            - name: Install dependencies
              run: bun install

            - name: Download kart-agent
              if: env.WITH_AGENT == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: kart-agent-x64
                  path: ${{ runner.temp }}/kart-agent

            - name: Build (x86_64)
              run: |
                  if [ "$WITH_AGENT" = true ]; then
                      export KART_AGENT_BIN="$RUNNER_TEMP/kart-agent/kart-agent"
                  else
                      export KART_AGENT_OPTIONAL=1
                  fi
                  bun run make

            # Installs the package on this disposable runner (real systemd, no containers).
            - name: Test the kart-agent service lifecycle
              if: env.WITH_AGENT == 'true'
              run: packaging/test/deb-systemd-test.sh out/make/deb/x64/*.deb

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: headunit-deb-x86
                  path: infotainment/headunit/out/make/deb/**/*.deb
                  retention-days: 7

    build-arm64:
        name: Build (arm64)
        runs-on: ubuntu-latest
        needs: [test, kart-agent]
        # Explicit results: the skipped `changes` job would otherwise skip this one too.
        if: ${{ !cancelled() && inputs.is-tag && needs.test.result == 'success' && needs.kart-agent.result == 'success' }}
        defaults:
            run:
                working-directory: infotainment/headunit
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # branch lookup for the watermark

            # Shown in the pre-release watermark; tag builds run on a detached HEAD, so look up the branch.
            - name: Resolve build branch
              run: |
                  branch="${GITHUB_HEAD_REF:-$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' | awk '$0 != "HEAD" && !b { b = $0 } END { print b }')}"
                  echo "HEADUNIT_BUILD_BRANCH=${branch:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v6.2.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
                  registries: |
                      https://registry.npmjs.org/
                      @asl-gokart:https://registry.leotm.de/

            # No cross toolchain: sero-node ships a prebuilt linux-arm64 addon, so electron-rebuild compiles nothing.
            - name: Install dependencies
              run: bun install

            - name: Download kart-agent
              uses: actions/download-artifact@v8
              with:
                  name: kart-agent-arm64
                  path: ${{ runner.temp }}/kart-agent

            - name: Build (arm64)
              env:
                  KART_AGENT_BIN: ${{ runner.temp }}/kart-agent/kart-agent
              run: bun run make:pi4

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: headunit-deb-arm64
                  path: infotainment/headunit/out/make/deb/arm64/*.deb
